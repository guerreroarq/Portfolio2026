<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#fafaf9">
    <title>Casa Monse | Daniel Guerrero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #fafaf9;
            --bg-light: #ffffff;
            --accent-1: #d4452c;
            --accent-2: #f4a261;
            --text-primary: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-light: #f8f6f3;
            --border-light: rgba(0, 0, 0, 0.08);
        }

        html {
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-weight: 400;
        }

        /* ═══════════════════════════════════════ */
        /* HEADER (matching Index_Arq2026)         */
        /* ═══════════════════════════════════════ */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: linear-gradient(180deg, var(--bg-dark) 0%, rgba(250, 250, 249, 0.95) 100%, transparent 100%);
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            text-decoration: none;
        }

        nav a {
            margin-left: 2.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 400;
            transition: color 0.3s;
            position: relative;
            letter-spacing: 0.02em;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent-1);
            transition: width 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-1);
        }

        nav a:hover::after {
            width: 100%;
        }

        /* ═══════════════════════════════════════ */
        /* MAIN CONTENT                            */
        /* ═══════════════════════════════════════ */
        main {
            width: min(calc(100% - 4rem), 1000px);
            margin: 0 auto;
            padding: 10rem 0 3rem;
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ═══════════════════════════════════════ */
        /* PROJECT HEADER                          */
        /* ═══════════════════════════════════════ */
        .project-header {
            margin-bottom: 3rem;
        }

        .project-subtitle {
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 0.8rem;
            font-weight: 700;
        }

        .project-title {
            font-family: Helvetica, Arial, sans-serif;
            font-size: clamp(2.6rem, 5vw, 5.5rem);
            font-weight: 400;
            line-height: 0.92;
            letter-spacing: -0.06em;
            margin-bottom: 2rem;
        }

        .project-title span {
            font-weight: 600;
            color: var(--accent-1);
        }

        /* ═══════════════════════════════════════ */
        /* PROJECT INFO                            */
        /* ═══════════════════════════════════════ */
        .project-info {
            max-width: 100%;
            margin-bottom: 3rem;
        }

        .location {
            font-family: Helvetica, Arial, sans-serif;
            font-size: clamp(1.25rem, 2.35vw, 2.5rem);
            font-weight: 400;
            margin-bottom: 1.5rem;
            letter-spacing: -0.01em;
        }

        .description {
            font-size: clamp(0.88rem, 1.1vw, 1rem);
            line-height: 1.55;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        .description p {
            margin-bottom: 1.5rem;
        }

        .description strong {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* ═══════════════════════════════════════ */
        /* PROJECT DETAILS                         */
        /* ═══════════════════════════════════════ */
        .project-details {
            max-width: 760px;
            margin: 3rem 0;
            padding: 2rem 0;
            border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
        }

        .detail-item {
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
        }

        .detail-label {
            font-weight: 600;
            color: var(--text-primary);
        }

        .detail-value {
            color: var(--text-secondary);
        }

        .credits {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-style: italic;
            margin-top: 1.5rem;
        }

        /* ═══════════════════════════════════════ */
        /* BLOG LAYOUT - 3 TIPOS DE CONTENIDO     */
        /* ═══════════════════════════════════════ */

        /*
         * TAMAÑOS DE IMAGEN RECOMENDADOS:
         * ─────────────────────────────────────
         * type: "a3"       → 2000 × 1414 px  (A3 landscape, ratio 1.414:1)
         * type: "render"   → 1920 × 1080 px  (16:9 landscape)
         * type: "panel"    → 1080 × 1920 px  (9:16 portrait)
         * ─────────────────────────────────────
         * Columna = 1000px max. Imágenes a 2x para retina.
         */

        .blog-stream {
            margin: 3rem 0;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .blog-item {
            width: 100%;
            overflow: hidden;
        }

        .blog-item img {
            display: block;
            width: 100%;
            height: auto;
        }

        .blog-item .caption {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.6rem;
            letter-spacing: 0.02em;
        }

        /* TYPE: A3 landscape — full width */
        .blog-item.type-a3 {
            max-width: 100%;
        }

        .blog-item.type-a3 img {
            aspect-ratio: 1.414 / 1;
            object-fit: cover;
        }

        /* TYPE: Render 16:9 — full width */
        .blog-item.type-render {
            max-width: 100%;
        }

        .blog-item.type-render img {
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        /* TYPE: Panel portrait 9:16 — centrado, ancho reducido */
        .blog-item.type-panel {
            max-width: 540px;
            margin-left: auto;
            margin-right: auto;
        }

        .blog-item.type-panel img {
            aspect-ratio: 9 / 16;
            object-fit: cover;
        }

        /* Lightbox */
        .blog-item img {
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .blog-item img:hover {
            opacity: 0.92;
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 92%;
            max-height: 90vh;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            padding: 0.5rem;
            line-height: 1;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .lightbox-close:hover { opacity: 1; }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            padding: 1rem 1.5rem;
            transition: background 0.3s ease;
            opacity: 0.7;
        }

        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.15);
            opacity: 1;
        }

        .lightbox-prev { left: 1.5rem; }
        .lightbox-next { right: 1.5rem; }

        /* ═══════════════════════════════════════ */
        /* PROJECT NAVIGATION                      */
        /* ═══════════════════════════════════════ */
        .project-nav {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            gap: 2rem;
        }

        .project-nav a {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: color 0.3s ease;
            position: relative;
        }

        .project-nav a::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent-1);
            transition: width 0.3s ease;
        }

        .project-nav a:hover {
            color: var(--accent-1);
        }

        .project-nav a:hover::after {
            width: 100%;
        }

        .nav-prev::before { content: '← '; }
        .nav-next::after { content: ' →'; position: static; }

        /* ═══════════════════════════════════════ */
        /* FOOTER                                  */
        /* ═══════════════════════════════════════ */
        footer {
            padding: 6rem 4rem 3rem;
            text-align: center;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-light);
            margin-top: 4rem;
        }

        footer p {
            font-size: 0.85rem;
            font-weight: 400;
        }

        /* ═══════════════════════════════════════ */
        /* RESPONSIVE                              */
        /* ═══════════════════════════════════════ */
        @media (max-width: 1024px) {
            header {
                padding: 1.5rem 2rem;
            }

            main {
                width: calc(100% - 4rem);
                padding: 7rem 0 3rem;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 1rem 1.5rem;
            }

            .logo {
                font-size: 1.1rem;
            }

            nav a {
                margin-left: 1rem;
                font-size: 0.75rem;
            }

            main {
                width: calc(100% - 3rem);
                padding: 6rem 0 2rem;
            }

            .project-header {
                margin-bottom: 2rem;
            }

            .blog-stream {
                gap: 1.5rem;
            }

            .blog-item.type-panel {
                max-width: 85%;
            }

            .project-nav {
                flex-direction: column;
                gap: 1rem;
            }

            .lightbox-nav {
                padding: 0.5rem 1rem;
                font-size: 1.5rem;
            }

            .lightbox-prev { left: 0.5rem; }
            .lightbox-next { right: 0.5rem; }

            footer {
                padding: 4rem 1.5rem 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER compartido con index.html -->
    <header>
        <a href="index.html" class="logo">Daniel Guerrero</a>
        <nav>
            <a href="index.html#servicios">Servicios</a>
            <a href="index.html#sobre-mi">Sobre mí</a>
            <a href="index.html#contacto">Contacto</a>
        </nav>
    </header>

    <main>
        <div class="project-header">
            <div class="project-subtitle" id="projectSubtitle"></div>
            <h1 class="project-title" id="projectTitle"></h1>
        </div>

        <!-- Hero image -->
        <div class="blog-item" id="heroImageContainer"></div>

        <div class="project-info">
            <h2 class="location" id="projectLocation"></h2>
            <div class="description" id="projectDescription"></div>
        </div>

        <div class="project-details" id="projectDetailsContainer"></div>

        <!-- Blog stream -->
        <div class="blog-stream" id="blogStream"></div>

        <nav class="project-nav" id="projectNavigation"></nav>
    </main>

    <footer>
        <p>© 2026 Daniel Guerrero · Arquitectura</p>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" aria-label="Cerrar">✕</button>
        <button class="lightbox-nav lightbox-prev" aria-label="Anterior">‹</button>
        <img src="" alt="" id="lightboxImage">
        <button class="lightbox-nav lightbox-next" aria-label="Siguiente">›</button>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // ███████╗██████╗ ██╗████████╗ █████╗     ██████╗ ██╗   ██╗██╗
        // ██╔════╝██╔══██╗██║╚══██╔══╝██╔══██╗    ██╔══██╗██║   ██║██║
        // █████╗  ██║  ██║██║   ██║   ███████║    ███████║██║   ██║██║
        // ██╔══╝  ██║  ██║██║   ██║   ██╔══██║    ██╔══██║██║▄█╗██║██║
        // ███████╗██████╔╝██║   ██║   ██║  ██║    ██║  ██║╚██████╔╝██║
        // ╚══════╝╚═════╝ ╚═╝   ╚═╝   ╚═╝  ╚═╝    ╚═╝  ╚═╝ ╚══▀▀═╝ ╚═╝
        // ═══════════════════════════════════════════════════════════════
        // EDITA ESTA SECCIÓN - TODO LO DEMÁS SE ACTUALIZA AUTOMÁTICAMENTE
        // ═══════════════════════════════════════════════════════════════

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 1. INFORMACIÓN DEL PROYECTO
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const PROJECT = {
            // Subtítulo (categoría)
            subtitle: "Ampliación y nueva unidad de vivienda",

            // Título del proyecto
            title: "Casa Monse",

            // Ubicación
            location: "Córdoba, Argentina",

            // Imagen hero (la primera imagen grande)
            heroImage: "images_monse/monse-03.jpg",
            heroType: "a3",  // "render" (1920×1080) o "a3" (2000×1414)

            // Descripción del proyecto (usa \n\n para separar párrafos)
            description: `
                Casa Monse propone una ampliación que se incorpora a la vivienda existente con una identidad propia. 
                El nuevo volumen adopta los quiebres y las direcciones a 45° de la casa original, prolongando su geometría,
                y se diferencia mediante la expresión material y el marcado carácter vertical.
                En diálogo por contraste con la construcción preexistente, la ampliación se resuelve mediante una tecnología 
                liviana y una envolvente continua de color decisivo. 
                Los pliegues y recortes del volumen señalan los accesos y articulan los espacios y sus extensiones.<br>
                La intervención incorpora una nueva unidad residencial con funcionamiento independiente. 
                Su planta angosta se organiza a partir de una circulación longitudinal y una línea continua de equipamiento 
                ubicada sobre la medianera recta. Hacia el borde quebrado se disponen los espacios habitables, 
                que aprovechan la geometría irregular para diferenciar ambientes, generar balcones y expansiones exteriores.


            `,

            // Detalles técnicos
            details: [
                { label: "Año", value: "2021" },
                { label: "Superficie", value: "97 m²" },
                { label: "Programa", value: "Vivienda unifamiliar" },
                { label: "Estado", value: "Proyecto" },
                { label: "Autoría", value: "MULA Arquitectos" },
                { label: "Participación", value: "Colaborador, desarrollo técnico y visualización" },
            ],

            // Créditos
            //credits: "fotografías: © maría garcía | renders: estudio propio",

            // Navegación entre proyectos
            navigation: {
                prev: { text: "Proyecto anterior", link: "proyecto-dorms.html" },
                next: { text: "Proyecto siguiente", link: "proyecto-noe.html" }
            }
        };

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 2. BLOG DE IMÁGENES
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //
        // TIPOS DISPONIBLES:
        // ─────────────────────────────────────────────────────────────
        //  type: "a3"      → Lámina A3 apaisada   → Preparar a 2000 × 1414 px
        //  type: "render"  → Render 16:9           → Preparar a 1920 × 1080 px
        // ─────────────────────────────────────────────────────────────
        //
        // PARA AGREGAR OTRO BLOQUE DE IMAGEN:
        // 1. Agregá una coma después del bloque anterior.
        // 2. Copiá este bloque dentro de BLOG_IMAGES.
        // 3. Elegí type: "render" o type: "a3".
        //
        // {
        //     type: "render",
        //     src: "images_monse/nombre-imagen.jpg",
        //     alt: "Descripción accesible de la imagen",
        //     caption: "Texto que aparecerá debajo de la imagen"
        // }
        //
        // caption es opcional (dejar "" si no se necesita)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const BLOG_IMAGES = [
            { type: "a3",      src: "images_monse/monse-plano-01.jpg",              alt: "Planta Baja",       caption: "" },
            { type: "a3",      src: "images_monse/monse-plano-02.jpg",              alt: "Planta Baja",       caption: "" },
            { type: "a3",      src: "images_monse/monse-plano-03.jpg",              alt: "Planta Alta",       caption: "" },
            { type: "a3",      src: "images_monse/monse-plano-07.jpg",              alt: "Corte A-A",         caption: "" },
            { type: "a3",      src: "images_monse/monse-plano-08.jpg",              alt: "Detalles",          caption: "" },
            { type: "a3",      src: "images_monse/monse-plano-09.jpg",              alt: "Detalles",          caption: "" },
            { type: "a3",      src: "images_monse/monse-plano-10.jpg",              alt: "Detalles",          caption: "" },
            { type: "a3",      src: "images_monse/monse-04.jpg",                    alt: "Renders",            caption: "" },
            { type: "a3",      src: "images_monse/monse-01.jpg",                    alt: "Renders",            caption: "" },
            { type: "a3",      src: "images_monse/monse-02.jpg",                    alt: "Renders",            caption: "" },
           


            // ← AGREGA MÁS IMÁGENES AQUÍ

        ];

        // ═══════════════════════════════════════════════════════════════
        // NO EDITES DEBAJO DE ESTA LÍNEA (código automático)
        // ═══════════════════════════════════════════════════════════════

        // Update page title
        document.title = `${PROJECT.title} | Daniel Guerrero`;

        // Render project header
        if (PROJECT.subtitle) {
            document.getElementById('projectSubtitle').textContent = PROJECT.subtitle;
        }
        document.getElementById('projectTitle').textContent = PROJECT.title;

        // Render hero image
        const heroContainer = document.getElementById('heroImageContainer');
        heroContainer.classList.add(`type-${PROJECT.heroType}`);
        const heroImg = document.createElement('img');
        heroImg.src = PROJECT.heroImage;
        heroImg.alt = PROJECT.title;
        heroImg.style.cssText = 'display:block;width:100%;height:auto;';
        if (PROJECT.heroType === 'a3') heroImg.style.aspectRatio = '1.414 / 1';
        if (PROJECT.heroType === 'render') heroImg.style.aspectRatio = '16 / 9';
        if (PROJECT.heroType === 'panel') heroImg.style.aspectRatio = '9 / 16';
        heroImg.style.objectFit = 'cover';
        heroContainer.appendChild(heroImg);

        // Render location
        document.getElementById('projectLocation').textContent = PROJECT.location;

        // Render description
        const descContainer = document.getElementById('projectDescription');
        const paragraphs = PROJECT.description.trim().split('\n\n');
        paragraphs.forEach(para => {
            if (para.trim()) {
                const p = document.createElement('p');
                p.innerHTML = para.trim();
                descContainer.appendChild(p);
            }
        });

        // Render details
        const detailsContainer = document.getElementById('projectDetailsContainer');
        PROJECT.details.forEach(detail => {
            const item = document.createElement('div');
            item.className = 'detail-item';
            item.innerHTML = `<span class="detail-label">${detail.label}:</span> <span class="detail-value">${detail.value}</span>`;
            detailsContainer.appendChild(item);
        });

        if (PROJECT.credits) {
            const credits = document.createElement('div');
            credits.className = 'credits';
            credits.textContent = PROJECT.credits;
            detailsContainer.appendChild(credits);
        }

        // Render blog stream
        const blogStream = document.getElementById('blogStream');
        const allImages = []; // for lightbox

        // Add hero to lightbox array
        allImages.push({ src: PROJECT.heroImage, alt: PROJECT.title });

        BLOG_IMAGES.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = `blog-item type-${item.type}`;

            const img = document.createElement('img');
            img.src = item.src;
            img.alt = item.alt;
            img.loading = 'lazy';
            img.onclick = () => openLightbox(index + 1); // +1 because hero is index 0
            div.appendChild(img);

            if (item.caption) {
                const caption = document.createElement('div');
                caption.className = 'caption';
                caption.textContent = item.caption;
                div.appendChild(caption);
            }

            blogStream.appendChild(div);
            allImages.push({ src: item.src, alt: item.alt });
        });

        // Hero click → lightbox
        heroImg.style.cursor = 'pointer';
        heroImg.onclick = () => openLightbox(0);

        // Render project navigation
        if (PROJECT.navigation) {
            const navContainer = document.getElementById('projectNavigation');
            if (PROJECT.navigation.prev) {
                const prevLink = document.createElement('a');
                prevLink.href = PROJECT.navigation.prev.link;
                prevLink.className = 'nav-prev';
                prevLink.textContent = PROJECT.navigation.prev.text;
                navContainer.appendChild(prevLink);
            }
            if (PROJECT.navigation.next) {
                const nextLink = document.createElement('a');
                nextLink.href = PROJECT.navigation.next.link;
                nextLink.className = 'nav-next';
                nextLink.textContent = PROJECT.navigation.next.text;
                navContainer.appendChild(nextLink);
            }
        }

        // ═══════════════════════════════════════
        // LIGHTBOX
        // ═══════════════════════════════════════
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        let currentImageIndex = 0;

        function openLightbox(index) {
            currentImageIndex = index;
            updateLightboxImage();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        function updateLightboxImage() {
            lightboxImage.src = allImages[currentImageIndex].src;
            lightboxImage.alt = allImages[currentImageIndex].alt;
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % allImages.length;
            updateLightboxImage();
        }

        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + allImages.length) % allImages.length;
            updateLightboxImage();
        }

        document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
        document.querySelector('.lightbox-next').addEventListener('click', nextImage);
        document.querySelector('.lightbox-prev').addEventListener('click', prevImage);

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
        });
    </script>
</body>
</html>
